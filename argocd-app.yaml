
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mychart-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/03ayeshasaleem-cmd/mychart.git
    targetRevision: main
    path: .
    helm:
      releaseName: mychart-app
  destination:
    server: https://kubernetes.default.svc
    namespace: mychart-demo
  syncPolicy:
    syncOptions:
      - CreateNamespace=true

